[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/waitlist/request"
  to = "/.netlify/functions/request-verification"
  status = 200
[[redirects]]
  from = "/api/waitlist/verify"
  to = "/.netlify/functions/verify-email"
  status = 200

# Passwordless WeaveRelay account
[[redirects]]
  from = "/api/auth/request"
  to = "/.netlify/functions/auth-request"
  status = 200
[[redirects]]
  from = "/api/auth/verify"
  to = "/.netlify/functions/auth-verify"
  status = 200
[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-session"
  status = 200
[[redirects]]
  from = "/api/auth/signout"
  to = "/.netlify/functions/auth-signout"
  status = 200

# Customer workspaces
[[redirects]]
  from = "/api/workspaces"
  to = "/.netlify/functions/workspace-list"
  status = 200
[[redirects]]
  from = "/api/workspace"
  to = "/.netlify/functions/workspace-get"
  status = 200
[[redirects]]
  from = "/api/workspace/create"
  to = "/.netlify/functions/workspace-create"
  status = 200
[[redirects]]
  from = "/api/workspace/claim-client"
  to = "/.netlify/functions/workspace-claim-client"
  status = 200

# Privacy-safe browser runtime telemetry from an authorized customer site
[[redirects]]
  from = "/api/runtime/beacon"
  to = "/.netlify/functions/runtime-beacon"
  status = 200

# Explicitly approved, non-destructive synthetic browser journeys
[[redirects]]
  from = "/api/synthetic/journey"
  to = "/.netlify/functions/synthetic-journey-config"
  status = 200
[[redirects]]
  from = "/api/synthetic/run"
  to = "/.netlify/functions/synthetic-journey-run"
  status = 200

# Provider authorization + diagnostics
[[redirects]]
  from = "/api/provider/start"
  to = "/.netlify/functions/provider-start"
  status = 200
[[redirects]]
  from = "/api/provider/probe"
  to = "/.netlify/functions/provider-probe"
  status = 200
[[redirects]]
  from = "/api/provider/connect-key"
  to = "/.netlify/functions/provider-connect-key"
  status = 200
[[redirects]]
  from = "/api/provider/disconnect"
  to = "/.netlify/functions/provider-disconnect"
  status = 200
[[redirects]]
  from = "/api/provider/window"
  to = "/.netlify/functions/provider-window"
  status = 200
[[redirects]]
  from = "/api/provider/window/netlify"
  to = "/.netlify/functions/provider-window-netlify"
  status = 200
[[redirects]]
  from = "/api/provider/window/supabase"
  to = "/.netlify/functions/provider-window-supabase"
  status = 200
[[redirects]]
  from = "/api/oauth/github/callback"
  to = "/.netlify/functions/oauth-github-callback"
  status = 200
[[redirects]]
  from = "/api/oauth/railway/callback"
  to = "/.netlify/functions/oauth-railway-callback"
  status = 200
[[redirects]]
  from = "/api/diagnose"
  to = "/.netlify/functions/diagnose-workspace-expanded"
  status = 200

# RunPod controls — exact reviewed Pods only; stopping requires explicit approval
[[redirects]]
  from = "/api/runpod/pods"
  to = "/.netlify/functions/runpod-pods"
  status = 200
[[redirects]]
  from = "/api/runpod/stop"
  to = "/.netlify/functions/runpod-stop-pod"
  status = 200
[[redirects]]
  from = "/api/runpod/stop-all"
  to = "/.netlify/functions/runpod-stop-all"
  status = 200

# Approved, narrowly scoped repairs
[[redirects]]
  from = "/api/repair/railway-supabase"
  to = "/.netlify/functions/repair-railway-supabase"
  status = 200
[[redirects]]
  from = "/api/repair/railway-redeploy"
  to = "/.netlify/functions/repair-railway-redeploy"
  status = 200
[[redirects]]
  from = "/api/repair/netlify-redeploy"
  to = "/.netlify/functions/repair-netlify-redeploy"
  status = 200
[[redirects]]
  from = "/api/repair/stripe-webhook"
  to = "/.netlify/functions/repair-stripe-webhook"
  status = 200
[[redirects]]
  from = "/api/repair/stripe-handler-secret"
  to = "/.netlify/functions/repair-stripe-handler-secret"
  status = 200

# Studio One is Client #1. It seeds evidence; provider authorization becomes source of truth.
[[redirects]]
  from = "/api/relay/handshake"
  to = "/.netlify/functions/relay-handshake"
  status = 200
[[redirects]]
  from = "/api/relay/workspace"
  to = "/.netlify/functions/relay-workspace"
  status = 200
[[redirects]]
  from = "/api/relay/provider/start"
  to = "/.netlify/functions/relay-provider-start"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://github.com https://api.github.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com"

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/app.html"
  status = 200
