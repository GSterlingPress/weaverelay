<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · WeaveRelay</title><link rel="stylesheet" href="/wr-app.css"></head><body><main class="auth-shell"><div class="brandline">WeaveRelay</div><section class="auth-card"><div class="eyebrow2">Passwordless sign-in</div><h1>Finish signing in.</h1><p>This second click prevents email security scanners from accidentally using your sign-in link.</p><button id="go" class="primary">Sign in to WeaveRelay →</button><p id="status" class="statusline"></p></section></main><script>const t=new URLSearchParams(location.search).get('t')||'',b=document.querySelector('#go'),s=document.querySelector('#status');b.onclick=async()=>{b.disabled=true;s.textContent='Signing you in…';try{const r=await fetch('/api/auth/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Sign-in failed.');location.replace(j.next||'/app.html')}catch(e){s.textContent=e.message;b.disabled=false}};</script></body></html>
