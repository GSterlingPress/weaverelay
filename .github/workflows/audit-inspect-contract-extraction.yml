name: Audit inspect contract extraction
on:
  workflow_dispatch:
  push:
    branches: [audit-hardening-four-failures]
    paths: ['.github/workflows/audit-inspect-contract-extraction.yml']
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct frozen runtime
        run: |
          mkdir -p /tmp/audit-runtime
          cat audit-pilot/runtime.* | base64 --decode > /tmp/audit-runtime.tar.xz
          tar -xJf /tmp/audit-runtime.tar.xz -C /tmp/audit-runtime
      - name: Print relevant extraction source
        run: |
          echo '=== ingest.py ==='
          sed -n '1,320p' /tmp/audit-runtime/audit_engine/ingest.py
          echo '=== vision_ocr.py ==='
          sed -n '1,360p' /tmp/audit-runtime/audit_engine/vision_ocr.py
          echo '=== pipeline.py ==='
          sed -n '1,180p' /tmp/audit-runtime/audit_engine/pipeline.py
