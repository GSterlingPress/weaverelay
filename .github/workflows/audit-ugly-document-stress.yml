name: Audit ugly document stress
on:
  push:
    branches: [audit-hardening-four-failures]
    paths:
      - 'audit-pilot/benchmarks/ugly_document_stress.py'
      - 'audit-pilot/hardening_patch.py'
      - '.github/workflows/audit-ugly-document-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ugly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Reconstruct frozen packaged audit runtime
        run: |
          mkdir -p /tmp/audit-runtime
          cat audit-pilot/runtime.* | base64 --decode > /tmp/audit-runtime.tar.xz
          xz --test /tmp/audit-runtime.tar.xz
          tar -xJf /tmp/audit-runtime.tar.xz -C /tmp/audit-runtime
          test -f /tmp/audit-runtime/audit_engine/pipeline.py
      - name: Apply current narrow hardening
        run: python audit-pilot/hardening_patch.py /tmp/audit-runtime
      - name: Install runtime dependencies
        run: pip install -r /tmp/audit-runtime/requirements.txt
      - name: Run ugly 108-page PDF benchmark
        env:
          AUDIT_RUNTIME_DIR: /tmp/audit-runtime
        run: |
          set -o pipefail
          python audit-pilot/benchmarks/ugly_document_stress.py | tee ugly-document-stress.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-ugly-document-stress
          path: ugly-document-stress.json
