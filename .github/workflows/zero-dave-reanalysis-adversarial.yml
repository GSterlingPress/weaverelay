name: Zero-Dave Reanalysis Adversarial Gate
on:
  push:
    branches: [audit-zero-dave-reanalysis-loop-v2]
    paths:
      - 'audit-pilot/reanalysis.py'
      - 'audit-pilot/sealed_room.py'
      - 'audit-pilot/sandbox_escape_probe.py'
      - 'audit-pilot/sandbox_escape_gate.py'
      - 'audit-pilot/test_reanalysis_adversarial.py'
      - 'audit-pilot/reanalysis_child_process_gate.py'
      - 'audit-pilot/Dockerfile.zero-dave'
      - '.github/workflows/zero-dave-reanalysis-adversarial.yml'
  workflow_dispatch:
jobs:
  adversarial:
    runs-on: ubuntu-latest
    env:
      ZERO_DAVE_SANDBOX_IMAGE: zero-dave-reanalysis-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pypdf openpyxl
      - name: Four adversarial reconciliation gates
        working-directory: audit-pilot
        run: pytest -q test_reanalysis_adversarial.py
      - name: Build packaged Zero-Dave runtime
        working-directory: audit-pilot
        run: docker build -f Dockerfile.zero-dave -t zero-dave-reanalysis-gate .
      - name: Active one-container sandbox escape gate
        working-directory: audit-pilot
        run: python sandbox_escape_gate.py
      - name: Real one-container-per-analyzer forced-disagreement integration gate
        working-directory: audit-pilot
        run: python reanalysis_child_process_gate.py
