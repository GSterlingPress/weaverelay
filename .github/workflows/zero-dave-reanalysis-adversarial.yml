name: Zero-Dave Reanalysis Adversarial Gate
on:
  push:
    branches: [audit-zero-dave-reanalysis-loop-v2]
    paths:
      - 'audit-pilot/reanalysis.py'
      - 'audit-pilot/test_reanalysis_adversarial.py'
      - 'audit-pilot/reanalysis_child_process_gate.py'
      - '.github/workflows/zero-dave-reanalysis-adversarial.yml'
  workflow_dispatch:
jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pypdf openpyxl
      - name: Four adversarial reconciliation gates
        working-directory: audit-pilot
        run: pytest -q test_reanalysis_adversarial.py
      - name: Real child-process forced-disagreement integration gate
        working-directory: audit-pilot
        run: python reanalysis_child_process_gate.py
