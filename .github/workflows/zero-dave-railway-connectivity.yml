name: Zero-Dave Railway Connectivity Probe
on:
  push:
    branches: [audit-zero-dave-three-analyzer]
    paths: ['.github/workflows/zero-dave-railway-connectivity.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe bare server
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 60 -o body.txt -w '%{http_code}' 'https://zero-dave-branch-staging-production.up.railway.app/')
          echo "STATUS=$status"
          head -c 500 body.txt || true
          echo
          test "$status" = "200"
