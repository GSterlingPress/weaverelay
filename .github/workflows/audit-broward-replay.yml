name: Audit Broward Replay 1

on:
  push:
    branches:
      - audit-broward-replay-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct frozen packaged audit runtime
        run: |
          mkdir -p /tmp/audit-runtime
          cat audit-pilot/runtime.* | base64 --decode > /tmp/audit-runtime.tar.xz
          xz --test /tmp/audit-runtime.tar.xz
          tar -xJf /tmp/audit-runtime.tar.xz -C /tmp/audit-runtime
          test -f /tmp/audit-runtime/audit_engine/pipeline.py
      - name: Install frozen runtime dependencies
        run: pip install -r /tmp/audit-runtime/requirements.txt
      - name: Run Broward public-record replay unchanged
        env:
          AUDIT_RUNTIME_DIR: /tmp/audit-runtime
        run: |
          python audit-pilot/benchmarks/broward_public_replay.py | tee broward-replay-output.json
      - name: Upload frozen first-run output
        uses: actions/upload-artifact@v4
        with:
          name: broward-replay-first-run
          path: broward-replay-output.json
          if-no-files-found: error
