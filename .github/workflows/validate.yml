name: Validate WeaveRelay

on:
  pull_request:
  push:
    branches:
      - main
      - cross-system-diagnosis-v1
      - post-production-hardening-2026-09-02

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run build
